<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharma Temp & Route Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Thư viện đọc file PDF trực tiếp -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>
<body class="bg-slate-100 min-h-screen p-6">
    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-md p-6 space-y-6">
        <h1 class="text-2xl font-bold text-blue-900">Pharma Temp & Route Intelligence</h1>
        
        <div class="space-y-2">
            <label class="block text-sm font-semibold text-gray-700">TẢI LÊN HOẶC DÁN DỮ LIỆU NHIỆT ĐỘ (PDF / CSV / TEXT)</label>
            
            <!-- Khu vực chọn file PDF -->
            <div class="flex items-center justify-center w-full">
                <label for="pdf-file-input" class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <svg class="w-8 h-8 mb-3 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">Bấm để chọn file PDF báo cáo</span></p>
                        <p class="text-xs text-gray-500">Hỗ trợ file PDF, CSV, TXT từ Data Logger</p>
                    </div>
                    <input id="pdf-file-input" type="file" accept=".pdf,.csv,.txt" class="hidden" onchange="handleFileSelect(event)" />
                </label>
            </div>

            <!-- Khung text dự phòng -->
            <textarea id="raw-data-input" rows="5" class="w-full p-3 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500" placeholder="Nội dung dữ liệu sẽ hiển thị ở đây sau khi chọn file..."></textarea>
        </div>
    </div>

    <script>
        async function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.type === 'application/pdf') {
                const reader = new FileReader();
                reader.readAsArrayBuffer(file);
                reader.onload = async function() {
                    const typedarray = new Uint8Array(this.result);
                    try {
                        const pdf = await pdfjsLib.getDocument(typedarray).promise;
                        let fullText = '';
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const textContent = await page.getTextContent();
                            const pageText = textContent.items.map(item => item.str).join(' ');
                            fullText += `--- Trang ${i} ---\n` + pageText + '\n';
                        }
                        document.getElementById('raw-data-input').value = fullText;
                        alert(`Đã đọc thành công file PDF (${pdf.numPages} trang)!`);
                    } catch (error) {
                        console.error("Lỗi đọc PDF:", error);
                        alert("Không thể đọc file PDF này.");
                    }
                };
            } else {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('raw-data-input').value = e.target.result;
                };
                reader.readAsText(file);
            }
        }
    </script>
</body>
</html>
